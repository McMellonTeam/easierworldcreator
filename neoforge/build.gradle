plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "me.modmuss50.mod-publish-plugin" version "0.8.1"
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    //jarJar("com.moandjiezana.toml:toml4j:0.7.2")
    //implementation(group: 'com.moandjiezana.toml', name: 'toml4j', version: '0.7.2')
    implementation(group: 'com.moandjiezana.toml', name: 'toml4j', version: '0.7.2')
    jarJar(group: 'com.moandjiezana.toml', name: 'toml4j', version: '0.7.2')
}

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile, javadocJar.archiveFile)

    changelog = file("../changelog.md").text
    type = STABLE
    modLoaders.add("neoforge")

    displayName = "ewc-neoforge ${project.mod_version}"

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1069458"
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        serverRequired = true
        changelogType = "markdown"
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "Ut6vTr1q"
        minecraftVersions.add("1.21.1")
    }

    github {
        accessToken = providers.environmentVariable("GITHUB_API_KEY")
        repository = "McMellonTeam/easierworldcreator"
        commitish = "1.21.1"
    }
}
